<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>笨笨的の歌单</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            background: #0f1117;
            color: #d7dce5;
            font-family: "PingFang SC", sans-serif;
            overflow-x: hidden;
        }

        .container {
            width: 88%;
            max-width: 500px;
            margin: auto;
            padding-top: 40px;
            padding-bottom: 100px;
        }

        .title {
            font-size: 28px;
            margin-bottom: 28px;
            letter-spacing: 1px;
            color: #e8edf5;
        }

        .search-box {
            width: 100%;
            height: 48px;
            border-radius: 14px;
            border: 1px solid #3c4557;
            background: #161b24;
            color: white;
            padding-left: 16px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }

        .search-box::placeholder {
            color: #7e8798;
        }

        .hint {
            margin-top: 10px;
            margin-bottom: 38px;
            color: #6f7888;
            font-size: 13px;
        }

        .songs {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
        }

        .song {
            color: #c8d2e4;
            text-decoration: none;
            font-size: 15px;
            transition: 0.25s;
            cursor: pointer;
            line-height: 1.8;
        }

        .song:hover {
            color: #8eb8ff;
            text-shadow: 0 0 10px rgba(142,184,255,0.6);
        }

        .song-page {
            display: none;
            min-height: 100vh;
            background: #0f1117;
            color: white;
            padding: 30px;
            box-sizing: border-box;
        }

        .back {
            color: #8ea7d8;
            margin-bottom: 30px;
            display: inline-block;
            cursor: pointer;
        }

        .cover {
            width: 100%;
            border-radius: 18px;
            margin-bottom: 28px;
            opacity: 0.9;
        }

        .song-title {
            font-size: 30px;
            margin-bottom: 24px;
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }

        .not-found {
            display: none;
            min-height: 100vh;
            background: #0f1117;
            color: #d8dde7;
            padding: 40px 28px;
            box-sizing: border-box;
        }

        .not-found h1 {
            font-size: 24px;
            margin-bottom: 24px;
            font-weight: normal;
        }

        .not-found p {
            color: #8992a5;
            line-height: 1.9;
        }

    </style>
</head>

<body>

    <div class="container" id="homePage">

        <div class="title">
            笨笨的の歌单
        </div>

        <input
            class="search-box"
            id="searchInput"
            placeholder="搜索歌名..."
        >

        <div class="hint">
            试试搜索
        </div>

        <div class="songs" id="songList"></div>

    </div>

    <div class="song-page" id="songPage">

        <div class="back" onclick="goHome()">
            ← 返回歌单
        </div>

        <img
            class="cover"
            id="songImage"
            src="https://picsum.photos/500/500?blur=2"
        >

        <div class="song-title" id="songTitle"></div>

        <audio controls>
            <source src="" type="audio/mpeg">
        </audio>

    </div>

    <div class="not-found" id="notFoundPage">

        <div class="back" onclick="goHome()">
            ← 返回
        </div>

        <h1>
            不好意思
        </h1>

        <p>
            笨笨的还不会这首歌<br>
            可以加入待学歌单哟
        </p>

    </div>

    <script>

        const songs = [

            "流浪","温室","伏线","雪藏","背叛","收藏","雨天","揉光",
            "就让","散场","情结","恶作剧","慢慢的","说什么","贪吃蛇",
            "忘与记","复乐园","从此以后","假装快乐","何必不舍",
            "会呼吸的痛","夏日倒计时","一直很安静","最初的记忆",
            "抹不掉的你","想念拟人化","十二月的奇迹",
            "你就是我的风景","在加纳共和国离婚","你","瞬","坠","换",
            "于是","绽放","遐想","忘记","彻夜","白板","小微光","小胡同",
            "遗忘周","平行线","失落盛行","人群中的信","不见不离开",
            "NUNA3.0","你已把我的心磨平","想要成为的大人","有些",
            "慢慢","晚安","只你","篡改","嗜好","你想要的","孤单心事",
            "假装没变过","我只能离开","夏夜最后的烟火","我想","和你",
            "情话","再一起","九月底","天黑座","天气未报","日落沙滩后",
            "不对等天体","最好的都给你","触碰不到的你"

        ];

        const songList = document.getElementById("songList");

        songs.sort((a,b) => a.length - b.length);

        songs.forEach(song => {

            const item = document.createElement("a");

            item.className = "song";

            item.innerText = song;

            item.onclick = () => openSong(song);

            songList.appendChild(item);

        });

        function openSong(song) {

            document.getElementById("homePage").style.display = "none";

            document.getElementById("notFoundPage").style.display = "none";

            document.getElementById("songPage").style.display = "block";

            document.getElementById("songTitle").innerText = song;

        }

        function goHome() {

            document.getElementById("homePage").style.display = "block";

            document.getElementById("songPage").style.display = "none";

            document.getElementById("notFoundPage").style.display = "none";

        }

        document
            .getElementById("searchInput")
            .addEventListener("keypress", function(event) {

                if (event.key === "Enter") {

                    const value = this.value.trim();

                    if (songs.includes(value)) {

                        openSong(value);

                    } else {

                        document.getElementById("homePage").style.display = "none";

                        document.getElementById("songPage").style.display = "none";

                        document.getElementById("notFoundPage").style.display = "block";

                    }

                }

            });

    </script>

</body>

</html>
