<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
/>

<title>笨笨的の歌单</title>

<style>

body {

    margin: 0;

    padding: 0;

    min-height: 100vh;

    overflow-x: hidden;

    font-family: "PingFang SC", sans-serif;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.32),
            rgba(255,255,255,0.32)
        ),

        url("6c94bd44aub87983b35a5d977a232164.PNG");

    background-size: cover;

    background-position: center;

    background-attachment: fixed;

}

.container {

    width: 88%;

    max-width: 1400px;

    margin: auto;

    padding-top: 45px;

    padding-bottom: 120px;

    position: relative;

}

.title-image {

    width: 700px;

    max-width: 92%;

    margin-bottom: 40px;

    filter:

        drop-shadow(0 0 18px rgba(255,255,255,0.95))

        drop-shadow(0 0 35px rgba(255,192,203,0.35));

}

.search-box {

    width: 100%;

    max-width: 760px;

    height: 68px;

    border-radius: 999px;

    border: 2px solid rgba(255,255,255,0.72);

    background: rgba(255,255,255,0.25);

    backdrop-filter: blur(14px);

    padding-left: 28px;

    font-size: 22px;

    color: #777;

    outline: none;

    box-sizing: border-box;

    box-shadow:

        0 0 25px rgba(255,255,255,0.25);

}

.search-box::placeholder {

    color: rgba(120,120,120,0.7);

}

.tip {

    margin-top: 22px;

    display: inline-flex;

    align-items: center;

    gap: 12px;

    padding: 16px 26px;

    border-radius: 999px;

    background: rgba(255,255,255,0.42);

    color: #ff8fb6;

    font-size: 24px;

    box-shadow:

        0 0 18px rgba(255,255,255,0.35);

}

.songs {

    margin-top: 65px;

    display: grid;

    grid-template-columns:

        repeat(auto-fit, minmax(180px, 1fr));

    gap: 30px 48px;

}

.song {

    color: #555;

    text-decoration: none;

    font-size: 24px;

    transition: 0.23s;

    cursor: pointer;

    letter-spacing: 1px;

    width: fit-content;

    position: relative;

}

.song:hover {

    color: #ff9dc5;

    transform: scale(1.08);

    text-shadow:

        0 0 12px rgba(255,255,255,0.92);

}

.song:hover::after {

    content: "♪";

    position: absolute;

    right: -26px;

    top: -2px;

    color: #ffb3d1;

}

.music-note {

    position: absolute;

    font-size: 46px;

    opacity: 0.65;

    color: white;

    text-shadow:

        0 0 14px rgba(255,255,255,0.9);

}

.note1 {

    top: 80px;

    right: 300px;

}

.note2 {

    top: 200px;

    right: 90px;

}

.note3 {

    bottom: 120px;

    right: 100px;

}

.note4 {

    bottom: 80px;

    left: 90px;

}

.note5 {

    top: 320px;

    left: 40px;

}

.note6 {

    bottom: 260px;

    right: 40px;

}

.note7 {

    bottom: 30px;

    left: 420px;

}

.sparkle {

    position: absolute;

    color: white;

    opacity: 0.8;

    font-size: 30px;

    text-shadow:

        0 0 10px rgba(255,255,255,0.9);

}

.sparkle1 {

    top: 70px;

    left: 760px;

}

.sparkle2 {

    top: 370px;

    right: 320px;

}

.sparkle3 {

    bottom: 100px;

    right: 220px;

}

.sparkle4 {

    bottom: 60px;

    left: 540px;

}

.sparkle5 {

    top: 150px;

    right: 600px;

}

.sparkle6 {

    bottom: 180px;

    left: 260px;

}

.vinyl {

    position: absolute;

    bottom: 10px;

    right: 40px;

    font-size: 120px;

    opacity: 0.45;

}

.cassette {

    position: absolute;

    top: 60px;

    right: 70px;

    font-size: 100px;

    opacity: 0.38;

}

.speaker {

    position: absolute;

    bottom: 30px;

    left: 100px;

    font-size: 100px;

    opacity: 0.35;

}

.headphone {

    position: absolute;

    bottom: 0;

    left: 0;

    font-size: 120px;

    opacity: 0.35;

}

.heart {

    position: absolute;

    color: white;

    opacity: 0.7;

    font-size: 28px;

}

.heart1 {

    top: 120px;

    left: 60px;

}

.heart2 {

    bottom: 220px;

    right: 100px;

}

.wave {

    position: absolute;

    width: 100%;

    height: 120px;

    left: 0;

    bottom: 0;

    opacity: 0.35;

}

.song-page {

    display: none;

    min-height: 100vh;

    padding: 70px;

    box-sizing: border-box;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.42),
            rgba(255,255,255,0.42)
        ),

        url("6c94bd44aub87983b35a5d977a232164.PNG");

    background-size: cover;

    background-position: center;

}

.back {

    color: #777;

    margin-bottom: 35px;

    display: inline-block;

    cursor: pointer;

    font-size: 20px;

}

.cover {

    width: 420px;

    max-width: 100%;

    border-radius: 30px;

    margin-bottom: 35px;

    box-shadow:

        0 0 35px rgba(255,255,255,0.45);

}

.song-title {

    font-size: 52px;

    color: #555;

    margin-bottom: 28px;

}

audio {

    width: 420px;

    max-width: 100%;

}

.not-found {

    display: none;

    min-height: 100vh;

    padding: 80px;

    box-sizing: border-box;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.42),
            rgba(255,255,255,0.42)
        ),

        url("6c94bd44aub87983b35a5d977a232164.PNG");

    background-size: cover;

    background-position: center;

}

.not-found h1 {

    font-size: 56px;

    color: #666;

    margin-bottom: 28px;

}

.not-found p {

    color: #888;

    line-height: 2;

    font-size: 24px;

}

</style>

</head>

<body>

<div
    class="container"
    id="homePage"
>

    <div class="music-note note1">♪</div>
    <div class="music-note note2">♫</div>
    <div class="music-note note3">♬</div>
    <div class="music-note note4">♩</div>
    <div class="music-note note5">♫</div>
    <div class="music-note note6">♪</div>
    <div class="music-note note7">♬</div>

    <div class="sparkle sparkle1">✦</div>
    <div class="sparkle sparkle2">✧</div>
    <div class="sparkle sparkle3">✦</div>
    <div class="sparkle sparkle4">✧</div>
    <div class="sparkle sparkle5">✦</div>
    <div class="sparkle sparkle6">✧</div>

    <div class="vinyl">💿</div>

    <div class="cassette">📼</div>

    <div class="speaker">🔊</div>

    <div class="headphone">🎧</div>

    <div class="heart heart1">♡</div>

    <div class="heart heart2">♡</div>

    <img
        class="title-image"
        src="9ed12ee0157756ac198107745b9dd3ab.jpg"
    />

    <br>

    <input

        class="search-box"

        id="searchInput"

        placeholder="试试搜索"

    >

    <br>

    <div class="tip">

        🎼 点击歌名可以试听哟 ♡

    </div>

    <div
        class="songs"
        id="songList"
    ></div>

</div>

<div
    class="song-page"
    id="songPage"
>

    <div
        class="back"
        onclick="goHome()"
    >

        ← 返回歌单

    </div>

    <img

        class="cover"

        id="songImage"

        src="6c94bd44aub87983b35a5d977a232164.PNG"

    >

    <div
        class="song-title"
        id="songTitle"
    ></div>

    <audio controls>

        <source
            src=""
            type="audio/mpeg"
        >

    </audio>

</div>

<div
    class="not-found"
    id="notFoundPage"
>

    <div
        class="back"
        onclick="goHome()"
    >

        ← 返回

    </div>

    <h1>
        不好意思
    </h1>

    <p>

        笨笨的还不会这首歌<br>

        可以加入待学歌单哟

    </p>

</div>

<script>

const songs = [

    "流浪","温室","伏线","雪藏","背叛","收藏","雨天","揉光",
    "就让","散场","情结","恶作剧","慢慢的","说什么","贪吃蛇",
    "忘与记","复乐园","从此以后","假装快乐","何必不舍",
    "会呼吸的痛","夏日倒计时","一直很安静","最初的记忆",
    "抹不掉的你","想念拟人化","十二月的奇迹",
    "你就是我的风景","在加纳共和国离婚","你","瞬","坠","换",
    "于是","绽放","遐想","忘记","彻夜","白板","小微光","小胡同",
    "遗忘周","平行线","失落盛行","人群中的信","不见不离开",
    "NUNA3.0","你已把我的心磨平","想要成为的大人","有些",
    "慢慢","晚安","只你","篡改","嗜好","你想要的","孤单心事",
    "假装没变过","我只能离开","夏夜最后的烟火","我想","和你",
    "情话","再一起","九月底","天黑座","天气未报","日落沙滩后",
    "不对等天体","最好的都给你","触碰不到的你"

];

const songList = document.getElementById("songList");

songs.sort((a,b) => a.length - b.length);

songs.forEach(song => {

    const item = document.createElement("a");

    item.className = "song";

    item.innerText = song;

    item.onclick = () => openSong(song);

    songList.appendChild(item);

});

function openSong(song) {

    document.getElementById("homePage").style.display = "none";

    document.getElementById("notFoundPage").style.display = "none";

    document.getElementById("songPage").style.display = "block";

    document.getElementById("songTitle").innerText = song;

}

function goHome() {

    document.getElementById("homePage").style.display = "block";

    document.getElementById("songPage").style.display = "none";

    document.getElementById("notFoundPage").style.display = "none";

}

document
    .getElementById("searchInput")
    .addEventListener("keypress", function(event) {

        if (event.key === "Enter") {

            const value = this.value.trim();

            if (songs.includes(value)) {

                openSong(value);

            }

            else {

                document.getElementById("homePage").style.display = "none";

                document.getElementById("songPage").style.display = "none";

                document.getElementById("notFoundPage").style.display = "block";

            }

        }

    });

</script>

</body>

</html>
