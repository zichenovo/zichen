<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>笨笨的の歌单</title>

<link
href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap"
rel="stylesheet"
>

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;

}

body{

font-family:
"PingFang SC",
sans-serif;

background:

linear-gradient(
rgba(255,255,255,0.58),
rgba(255,255,255,0.58)
),

url("c5b43b83798577953b44d9cf363b9d59.jpg");

background-size:cover;
background-position:center;
background-attachment:fixed;

min-height:100vh;

overflow-x:hidden;

}

.container{

width:92%;
max-width:1700px;

margin:auto;

padding-top:45px;
padding-bottom:70px;

position:relative;

}

.title{

font-family:'Baloo 2', cursive;

font-size:88px;

font-weight:800;

letter-spacing:3px;

line-height:1;

margin-bottom:38px;

color:#575757;

text-shadow:

0 0 14px rgba(255,255,255,0.8);

}

.search{

width:100%;
max-width:820px;

height:72px;

border:none;

border-radius:999px;

padding-left:30px;

font-size:24px;

background:rgba(255,255,255,0.42);

backdrop-filter:blur(10px);

color:#555;

outline:none;

box-shadow:

0 0 25px rgba(255,255,255,0.2);

}

.search::placeholder{

color:#8a8a8a;

}

.top-tip{

position:absolute;

top:58px;
right:10px;

font-size:20px;

color:#777;

background:rgba(255,255,255,0.35);

padding:12px 22px;

border-radius:999px;

backdrop-filter:blur(8px);

}

.music{

position:absolute;

font-size:48px;

opacity:0.18;

color:#555;

}

.m1{

top:120px;
right:330px;

}

.m2{

top:300px;
right:100px;

}

.m3{

bottom:130px;
left:70px;

}

.m4{

bottom:60px;
right:60px;

}

.song-grid{

margin-top:55px;

display:grid;

grid-template-columns:
repeat(7, 1fr);

column-gap:30px;

row-gap:18px;

}

.song{

font-size:30px;

font-weight:600;

color:#444;

cursor:pointer;

transition:0.2s;

width:fit-content;

position:relative;

}

.song:hover{

transform:scale(1.08);

color:#8d8d8d;

}

.song:hover::after{

content:"♪";

position:absolute;

right:-24px;
top:-2px;

font-size:18px;

color:#999;

}

.song-page{

display:none;

padding:70px;

min-height:100vh;

background:

linear-gradient(
rgba(255,255,255,0.6),
rgba(255,255,255,0.6)
),

url("c5b43b83798577953b44d9cf363b9d59.jpg");

background-size:cover;
background-position:center;

}

.back{

font-size:22px;

color:#666;

cursor:pointer;

margin-bottom:40px;

display:inline-block;

}

.song-title{

font-size:58px;

font-weight:bold;

color:#555;

margin-bottom:30px;

}

.cover{

width:420px;

max-width:100%;

border-radius:26px;

margin-bottom:35px;

}

audio{

width:420px;
max-width:100%;

}

.not-found{

display:none;

padding:90px;

min-height:100vh;

background:

linear-gradient(
rgba(255,255,255,0.6),
rgba(255,255,255,0.6)
),

url("c5b43b83798577953b44d9cf363b9d59.jpg");

background-size:cover;
background-position:center;

}

.not-found h1{

font-size:60px;

color:#555;

margin-bottom:26px;

}

.not-found p{

font-size:26px;

line-height:2;

color:#777;

}

</style>

</head>

<body>

<div
class="container"
id="homePage"
>

<div class="top-tip">
♫ 点击歌名试听
</div>

<div class="music m1">♫</div>
<div class="music m2">♪</div>
<div class="music m3">♬</div>
<div class="music m4">♩</div>

<div class="title">
笨笨的の歌单
</div>

<input

class="search"

id="searchInput"

placeholder="试试搜索"

>

<div
class="song-grid"
id="songList"
></div>

</div>

<div
class="song-page"
id="songPage"
>

<div
class="back"
onclick="goHome()"
>

← 返回歌单

</div>

<img

class="cover"

id="songImage"

src="c5b43b83798577953b44d9cf363b9d59.jpg"

>

<div
class="song-title"
id="songTitle"
></div>

<audio controls>

<source
src=""
type="audio/mpeg"
>

</audio>

</div>

<div
class="not-found"
id="notFoundPage"
>

<div
class="back"
onclick="goHome()"
>

← 返回

</div>

<h1>
不好意思
</h1>

<p>

笨笨的还不会这首歌<br>

可以加入待学歌单哟

</p>

</div>

<script>

const songs = [

"流浪","温室","伏线","雪藏","背叛","收藏","雨天","揉光",
"就让","散场","情结","恶作剧","慢慢的","说什么","贪吃蛇",
"忘与记","复乐园","从此以后","假装快乐","何必不舍",
"会呼吸的痛","夏日倒计时","一直很安静","最初的记忆",
"抹不掉的你","想念拟人化","十二月的奇迹",
"你就是我的风景","在加纳共和国离婚","你","瞬","坠","换",
"于是","绽放","遐想","忘记","彻夜","白板","小微光","小胡同",
"遗忘周","平行线","失落盛行","人群中的信","不见不离开",
"NUNA3.0","你已把我的心磨平","想要成为的大人","有些",
"慢慢","晚安","只你","篡改","嗜好","你想要的","孤单心事",
"假装没变过","我只能离开","夏夜最后的烟火","我想","和你",
"情话","再一起","九月底","天黑座","天气未报","日落沙滩后",
"不对等天体","最好的都给你","触碰不到的你"

];

const songList = document.getElementById("songList");

songs.sort((a,b)=>a.length-b.length);

songs.forEach(song=>{

const item=document.createElement("div");

item.className="song";

item.innerText=song;

item.onclick=()=>openSong(song);

songList.appendChild(item);

});

function openSong(song){

document.getElementById("homePage").style.display="none";

document.getElementById("notFoundPage").style.display="none";

document.getElementById("songPage").style.display="block";

document.getElementById("songTitle").innerText=song;

}

function goHome(){

document.getElementById("homePage").style.display="block";

document.getElementById("songPage").style.display="none";

document.getElementById("notFoundPage").style.display="none";

}

document
.getElementById("searchInput")
.addEventListener("keypress",function(event){

if(event.key==="Enter"){

const value=this.value.trim();

if(songs.includes(value)){

openSong(value);

}

else{

document.getElementById("homePage").style.display="none";

document.getElementById("songPage").style.display="none";

document.getElementById("notFoundPage").style.display="block";

}

}

});

</script>

</body>

</html>
