<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>笨笨的の歌单</title>

<link
href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap"
rel="stylesheet"
>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:
"PingFang SC",
sans-serif;

background:
radial-gradient(circle at top left,#f4ece7 0%,transparent 35%),
radial-gradient(circle at bottom right,#e6e0db 0%,transparent 30%),
linear-gradient(135deg,#f5f2ef,#ece7e2,#f4f1ee);

min-height:100vh;

padding:40px 12px;

overflow-x:hidden;

display:flex;
justify-content:center;

}

/* 主卡片 */

.container{

width:100%;
max-width:980px;

background:rgba(255,255,255,0.45);

border-radius:42px;

padding:36px 26px 50px;

backdrop-filter:blur(10px);

position:relative;

overflow:hidden;

box-shadow:
0 10px 30px rgba(0,0,0,0.06);

}

/* 标题 */

.title{

font-family:'ZCOOL KuaiLe',cursive;

font-size:74px;

color:#706660;

margin-bottom:28px;

line-height:1.05;

}

/* 右上角 */

.tip{

position:absolute;

top:36px;
right:36px;

background:white;

padding:12px 20px;

border-radius:999px;

font-size:14px;

color:#7c7068;

box-shadow:0 3px 10px rgba(0,0,0,0.05);

}

/* 搜索框 */

.search-box{

width:100%;

margin-bottom:26px;

}

.search-box input{

width:100%;

padding:18px 24px;

border:none;

border-radius:999px;

background:rgba(255,255,255,0.7);

font-size:18px;

outline:none;

color:#665d57;

}

.search-box input::placeholder{

color:#aaa19a;

}

/* 音乐元素 */

.note{

position:absolute;

opacity:0.08;

font-size:70px;

pointer-events:none;

}

.note1{
left:20px;
top:180px;
}

.note2{
right:30px;
top:190px;
}

.note3{
right:50px;
bottom:250px;
}

/* 歌单 */

.song-grid{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:14px;

}

/* 单个歌名 */

.song{

display:block;

text-decoration:none;

border-radius:18px;

padding:16px;

background:rgba(255,255,255,0.6);

font-size:18px;

color:#625953;

transition:0.25s;

box-shadow:
0 3px 10px rgba(0,0,0,0.03);

}

.song:hover{

transform:translateY(-2px);

background:white;

}

/* 手机适配 */

@media(max-width:768px){

.title{
font-size:52px;
}

.song-grid{
grid-template-columns:repeat(2,1fr);
}

.tip{
position:static;
width:max-content;
margin-bottom:20px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="note note1">♫</div>
<div class="note note2">♪</div>
<div class="note note3">♬</div>

encodeURIComponent(value);

);

}

}
