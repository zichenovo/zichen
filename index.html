<!DOCTYPE html>
<html lang="zh">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>笨笨的の歌单</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400&display=swap"
        rel="stylesheet"
    >

    <style>

        body {

            margin: 0;

            padding: 0;

            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(255,255,255,0.72),
                    rgba(245,245,245,0.88)
                ),

                url('https://images.unsplash.com/photo-1515405295579-ba7b45403062?q=80&w=1200');

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

            overflow-x: hidden;

            font-family: "PingFang SC", sans-serif;

            color: #555;

        }

        .overlay {

            position: fixed;

            inset: 0;

            backdrop-filter: blur(2px);

            z-index: 0;

        }

        .container {

            position: relative;

            z-index: 2;

            width: 78%;

            max-width: 390px;

            margin: auto;

            padding-top: 75px;

            padding-bottom: 130px;

        }

        .title {

            font-family: 'Fredoka', sans-serif;

            font-size: 50px;

            line-height: 1.1;

            color: rgba(255,255,255,0.86);

            text-shadow:
                0 0 10px rgba(255,255,255,0.9),

                0 0 20px rgba(255,255,255,0.4);

            margin-bottom: 38px;

            letter-spacing: 1px;

        }

        .search-box {

            width: 100%;

            height: 50px;

            border: 1px solid rgba(255,255,255,0.5);

            border-radius: 18px;

            background: rgba(255,255,255,0.32);

            backdrop-filter: blur(10px);

            box-sizing: border-box;

            padding-left: 18px;

            color: #666;

            font-size: 15px;

            outline: none;

            box-shadow:
                0 0 20px rgba(255,255,255,0.15);

        }

        .search-box::placeholder {

            color: rgba(120,120,120,0.72);

        }

        .songs {

            margin-top: 48px;

            display: flex;

            flex-wrap: wrap;

            gap: 22px 28px;

            line-height: 2.3;

        }

        .song {

            color: #4f4f4f;

            text-decoration: none;

            font-size: 17px;

            transition: 0.25s;

            cursor: pointer;

            letter-spacing: 1px;

        }

        .song:hover {

            color: #8f95aa;

            text-shadow:
                0 0 10px rgba(255,255,255,0.9);

        }

        .song-page {

            display: none;

            min-height: 100vh;

            padding: 38px 28px;

            box-sizing: border-box;

            background:
                linear-gradient(
                    rgba(255,255,255,0.74),
                    rgba(245,245,245,0.88)
                ),

                url('https://images.unsplash.com/photo-1515405295579-ba7b45403062?q=80&w=1200');

            background-size: cover;

            background-position: center;

        }

        .back {

            color: #8c90a1;

            margin-bottom: 32px;

            display: inline-block;

            cursor: pointer;

            font-size: 15px;

        }

        .cover {

            width: 100%;

            border-radius: 26px;

            margin-bottom: 34px;

            opacity: 0.93;

            box-shadow:
                0 0 30px rgba(255,255,255,0.35);

        }

        .song-title {

            font-size: 34px;

            color: #4d4d4d;

            margin-bottom: 28px;

        }

        audio {

            width: 100%;

            opacity: 0.78;

        }

        .not-found {

            display: none;

            min-height: 100vh;

            padding: 80px 34px;

            box-sizing: border-box;

            background:
                linear-gradient(
                    rgba(255,255,255,0.74),
                    rgba(245,245,245,0.88)
                ),

                url('https://images.unsplash.com/photo-1515405295579-ba7b45403062?q=80&w=1200');

            background-size: cover;

            background-position: center;

        }

        .not-found h1 {

            font-size: 34px;

            font-weight: normal;

            color: #575757;

            margin-bottom: 28px;

        }

        .not-found p {

            color: #8a8a8a;

            line-height: 2;

            font-size: 16px;

        }

    </style>

</head>

<body>

    <div class="overlay"></div>

    <div
        class="container"
        id="homePage"
    >

        <div class="title">
            笨笨的の歌单
        </div>

        <input

            class="search-box"

            id="searchInput"

            placeholder="试试搜索"

        >

        <div
            class="songs"
            id="songList"
        ></div>

    </div>

    <div
        class="song-page"
        id="songPage"
    >

        <div
            class="back"
            onclick="goHome()"
        >

            ← 返回歌单

        </div>

        <img

            class="cover"

            id="songImage"

            src="https://picsum.photos/500/500?grayscale"

        >

        <div
            class="song-title"
            id="songTitle"
        ></div>

        <audio controls>

            <source
                src=""
                type="audio/mpeg"
            >

        </audio>

    </div>

    <div
        class="not-found"
        id="notFoundPage"
    >

        <div
            class="back"
            onclick="goHome()"
        >

            ← 返回

        </div>

        <h1>
            不好意思
        </h1>

        <p>

            笨笨的还不会这首歌<br>

            可以加入待学歌单哟

        </p>

    </div>

    <script>

        const songs = [

            "流浪","温室","伏线","雪藏","背叛","收藏","雨天","揉光",
            "就让","散场","情结","恶作剧","慢慢的","说什么","贪吃蛇",
            "忘与记","复乐园","从此以后","假装快乐","何必不舍",
            "会呼吸的痛","夏日倒计时","一直很安静","最初的记忆",
            "抹不掉的你","想念拟人化","十二月的奇迹",
            "你就是我的风景","在加纳共和国离婚","你","瞬","坠","换",
            "于是","绽放","遐想","忘记","彻夜","白板","小微光","小胡同",
            "遗忘周","平行线","失落盛行","人群中的信","不见不离开",
            "NUNA3.0","你已把我的心磨平","想要成为的大人","有些",
            "慢慢","晚安","只你","篡改","嗜好","你想要的","孤单心事",
            "假装没变过","我只能离开","夏夜最后的烟火","我想","和你",
            "情话","再一起","九月底","天黑座","天气未报","日落沙滩后",
            "不对等天体","最好的都给你","触碰不到的你"

        ];

        const songList = document.getElementById("songList");

        songs.sort((a,b) => a.length - b.length);

        songs.forEach(song => {

            const item = document.createElement("a");

            item.className = "song";

            item.innerText = song;

            item.onclick = () => openSong(song);

            songList.appendChild(item);

        });

        function openSong(song) {

            document.getElementById("homePage").style.display = "none";

            document.getElementById("notFoundPage").style.display = "none";

            document.getElementById("songPage").style.display = "block";

            document.getElementById("songTitle").innerText = song;

        }

        function goHome() {

            document.getElementById("homePage").style.display = "block";

            document.getElementById("songPage").style.display = "none";

            document.getElementById("notFoundPage").style.display = "none";

        }

        document
            .getElementById("searchInput")
            .addEventListener("keypress", function(event) {

                if (event.key === "Enter") {

                    const value = this.value.trim();

                    if (songs.includes(value)) {

                        openSong(value);

                    }

                    else {

                        document.getElementById("homePage").style.display = "none";

                        document.getElementById("songPage").style.display = "none";

                        document.getElementById("notFoundPage").style.display = "block";

                    }

                }

            });

    </script>

</body>

</html>
