<!DOCTYPE html>
<html lang="zh">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>笨笨的の歌单</title>

    <style>

        body {

            margin: 0;

            padding: 0;

            min-height: 100vh;

            overflow-x: hidden;

            font-family: "PingFang SC", sans-serif;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.55),
                    rgba(255,255,255,0.55)
                ),
                url("6c94bd44aub87983b35a5d977a232164.PNG");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

        }

        .container {

            width: 88%;

            max-width: 1200px;

            margin: auto;

            padding-top: 70px;

            padding-bottom: 120px;

        }

        .title {

            font-size: 72px;

            font-weight: bold;

            margin-bottom: 42px;

            line-height: 1.1;

            letter-spacing: 2px;

            background: linear-gradient(
                90deg,
                #ffb7d5,
                #a7c7ff,
                #ffd7a8
            );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            text-shadow:
                0 0 12px rgba(255,255,255,0.8),

                0 0 30px rgba(255,192,203,0.45);

        }

        .search-box {

            width: 100%;

            max-width: 700px;

            height: 58px;

            border-radius: 22px;

            border: 1px solid rgba(255,255,255,0.65);

            background: rgba(255,255,255,0.35);

            backdrop-filter: blur(10px);

            padding-left: 24px;

            font-size: 17px;

            color: #666;

            outline: none;

            box-sizing: border-box;

            box-shadow:
                0 0 30px rgba(255,255,255,0.25);

        }

        .search-box::placeholder {

            color: rgba(120,120,120,0.72);

        }

        .songs {

            margin-top: 55px;

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(150px, 1fr));

            gap: 24px 34px;

        }

        .song {

            color: #555;

            text-decoration: none;

            font-size: 21px;

            transition: 0.22s;

            cursor: pointer;

            letter-spacing: 1px;

        }

        .song:hover {

            color: #ff9dc5;

            transform: scale(1.06);

            text-shadow:
                0 0 12px rgba(255,255,255,0.9);

        }

        .song-page {

            display: none;

            min-height: 100vh;

            padding: 60px;

            box-sizing: border-box;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.6),
                    rgba(255,255,255,0.6)
                ),
                url("6c94bd44aub87983b35a5d977a232164.PNG");

            background-size: cover;

            background-position: center;

        }

        .back {

            color: #777;

            margin-bottom: 35px;

            display: inline-block;

            cursor: pointer;

            font-size: 16px;

        }

        .cover {

            width: 340px;

            max-width: 100%;

            border-radius: 28px;

            margin-bottom: 32px;

            box-shadow:
                0 0 35px rgba(255,255,255,0.45);

        }

        .song-title {

            font-size: 42px;

            color: #555;

            margin-bottom: 28px;

        }

        audio {

            width: 360px;

            max-width: 100%;

        }

        .not-found {

            display: none;

            min-height: 100vh;

            padding: 70px;

            box-sizing: border-box;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.6),
                    rgba(255,255,255,0.6)
                ),
                url("6c94bd44aub87983b35a5d977a232164.PNG");

            background-size: cover;

            background-position: center;

        }

        .not-found h1 {

            font-size: 48px;

            color: #666;

            margin-bottom: 28px;

        }

        .not-found p {

            color: #888;

            line-height: 2;

            font-size: 20px;

        }

    </style>

</head>

<body>

    <div
        class="container"
        id="homePage"
    >

        <div class="title">
            笨笨的の歌单
        </div>

        <input

            class="search-box"

            id="searchInput"

            placeholder="试试搜索"

        >

        <div
            class="songs"
            id="songList"
        ></div>

    </div>

    <div
        class="song-page"
        id="songPage"
    >

        <div
            class="back"
            onclick="goHome()"
        >

            ← 返回歌单

        </div>

        <img

            class="cover"

            id="songImage"

            src="8991ffab-65bc-430b-ba95-1bdee98c007b.jpg"

        >

        <div
            class="song-title"
            id="songTitle"
        ></div>

        <audio controls>

            <source
                src=""
                type="audio/mpeg"
            >

        </audio>

    </div>

    <div
        class="not-found"
        id="notFoundPage"
    >

        <div
            class="back"
            onclick="goHome()"
        >

            ← 返回

        </div>

        <h1>
            不好意思
        </h1>

        <p>

            笨笨的还不会这首歌<br>

            可以加入待学歌单哟

        </p>

    </div>

    <script>

        const songs = [

            "流浪","温室","伏线","雪藏","背叛","收藏","雨天","揉光",
            "就让","散场","情结","恶作剧","慢慢的","说什么","贪吃蛇",
            "忘与记","复乐园","从此以后","假装快乐","何必不舍",
            "会呼吸的痛","夏日倒计时","一直很安静","最初的记忆",
            "抹不掉的你","想念拟人化","十二月的奇迹",
            "你就是我的风景","在加纳共和国离婚","你","瞬","坠","换",
            "于是","绽放","遐想","忘记","彻夜","白板","小微光","小胡同",
            "遗忘周","平行线","失落盛行","人群中的信","不见不离开",
            "NUNA3.0","你已把我的心磨平","想要成为的大人","有些",
            "慢慢","晚安","只你","篡改","嗜好","你想要的","孤单心事",
            "假装没变过","我只能离开","夏夜最后的烟火","我想","和你",
            "情话","再一起","九月底","天黑座","天气未报","日落沙滩后",
            "不对等天体","最好的都给你","触碰不到的你"

        ];

        const songList = document.getElementById("songList");

        songs.sort((a,b) => a.length - b.length);

        songs.forEach(song => {

            const item = document.createElement("a");

            item.className = "song";

            item.innerText = song;

            item.onclick = () => openSong(song);

            songList.appendChild(item);

        });

        function openSong(song) {

            document.getElementById("homePage").style.display = "none";

            document.getElementById("notFoundPage").style.display = "none";

            document.getElementById("songPage").style.display = "block";

            document.getElementById("songTitle").innerText = song;

        }

        function goHome() {

            document.getElementById("homePage").style.display = "block";

            document.getElementById("songPage").style.display = "none";

            document.getElementById("notFoundPage").style.display = "none";

        }

        document
            .getElementById("searchInput")
            .addEventListener("keypress", function(event) {

                if (event.key === "Enter") {

                    const value = this.value.trim();

                    if (songs.includes(value)) {

                        openSong(value);

                    }

                    else {

                        document.getElementById("homePage").style.display = "none";

                        document.getElementById("songPage").style.display = "none";

                        document.getElementById("notFoundPage").style.display = "block";

                    }

                }

            });

    </script>

</body>

</html>
