```html
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>笨笨的の歌单</title>

<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"PingFang SC",sans-serif;
    min-height:100vh;
    background:
    radial-gradient(circle at top left,#f4ece7 0%,transparent 35%),
    radial-gradient(circle at bottom right,#e6e0db 0%,transparent 30%),
    linear-gradient(135deg,#f5f2ef,#ece7e2,#f4f1ee);

    color:#6d625b;
    display:flex;
    justify-content:center;
    padding:28px 12px;
}

/* 主卡片 */

.container{
    width:100%;
    max-width:920px;

    background:rgba(255,255,255,0.38);

    backdrop-filter:blur(8px);

    border-radius:42px;

    padding:36px 24px 50px;

    box-shadow:
    0 8px 30px rgba(120,100,90,0.08),
    inset 0 1px 0 rgba(255,255,255,0.7);

    position:relative;

    overflow:hidden;
}

/* 音符 */

.music-note{
    position:absolute;
    font-size:48px;
    opacity:0.08;
}

.note1{
    left:20px;
    top:120px;
}

.note2{
    right:30px;
    top:130px;
}

.note3{
    right:40px;
    bottom:360px;
}

/* 标题 */

.title{
    font-family:'ZCOOL KuaiLe',cursive;
    font-size:72px;
    line-height:1.05;
    color:#6f655f;

    margin-bottom:28px;

    letter-spacing:2px;

    text-shadow:
    0 2px 0 rgba(255,255,255,0.7),
    0 6px 18px rgba(120,110,100,0.12);
}

/* 试听提示 */

.listen-tip{
    position:absolute;
    top:34px;
    right:34px;

    background:rgba(255,255,255,0.72);

    padding:12px 18px;

    border-radius:999px;

    font-size:14px;

    color:#7b7068;

    box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

/* 搜索 */

.search-box{
    width:100%;
    margin-bottom:28px;
}

.search-box input{
    width:100%;
    padding:18px 24px;

    border:none;

    border-radius:999px;

    background:rgba(255,255,255,0.7);

    font-size:18px;

    outline:none;

    color:#6b615b;

    box-shadow:
    inset 0 1px 4px rgba(0,0,0,0.03),
    0 3px 10px rgba(0,0,0,0.03);
}

.search-box input::placeholder{
    color:#aaa19a;
}

/* 歌单 */

.song-grid{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:14px;

    margin-top:10px;
}

.song{

    background:rgba(255,255,255,0.58);

    border:none;

    border-radius:16px;

    padding:14px 14px;

    text-align:left;

    font-size:18px;

    color:#5d5550;

    cursor:pointer;

    transition:0.25s;

    box-shadow:
    0 3px 10px rgba(0,0,0,0.03);
}

.song:hover{
    transform:translateY(-2px);
    background:white;
}

/* 底部播放器 */

.player-section{

    margin-top:44px;

    background:rgba(255,255,255,0.52);

    border-radius:36px;

    padding:26px;

    display:flex;

    flex-direction:column;

    gap:22px;
}

.back{
    font-size:18px;
    color:#6c625c;
}

.player-content{

    display:flex;

    gap:26px;

    align-items:center;

    flex-wrap:wrap;
}

/* 左边图 */

.cover-image{

    width:320px;
    height:420px;

    object-fit:cover;

    border-radius:26px;

    box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

/* 右边 */

.right-side{

    flex:1;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:22px;
}

/* 唱片 */

.record{

    width:260px;
    height:260px;

    border-radius:50%;

    overflow:hidden;

    box-shadow:0 8px 30px rgba(0,0,0,0.08);
}

.record img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* audio */

audio{
    width:100%;
    max-width:380px;
}

/* 手机 */

@media(max-width:768px){

    .title{
        font-size:52px;
    }

    .song-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .player-content{
        flex-direction:column;
    }

    .cover-image{
        width:100%;
        height:auto;
    }

    .record{
        width:220px;
        height:220px;
    }

    .listen-tip{
        position:static;
        width:max-content;
        margin-bottom:18px;
    }
}

</style>
</head>

<body>

<div class="container">

<div class="music-note note1">♫</div>
<div class="music-note note2">♪</div>
<div class="music-note note3">♬</div>

<div class="listen-tip">
♫ 点击歌名试听
</div>

<h1 class="title">笨笨的の歌单</h1>

<div class="search-box">
<input id="searchInput" placeholder="试试搜索">
</div>

<div class="song-grid" id="songGrid"></div>

<!-- 播放器 -->

<div class="player-section">

<div class="back">← 返回歌单</div>

<div class="player-content">

<img
class="cover-image"
src="1b2c6149d84adfc08a08f05816b9221.jpg"
>

<div class="right-side">

<div class="record">
<img src="a05dabee4a8dc4d1e3f12c4acc7652b0.jpg">
</div>

<audio controls>
<source src="">
</audio>

</div>

</div>

</div>

</div>

<script>

const songs = [

"末日","走马","天赋","空空","半壶纱","要爱我","失眠了",
"小公主","after17","野火一季","心愿便利贴","梁山伯与朱丽叶",
"AlwaysOnline","你的crush降临了吗","绿色","爱我你就抱抱我",
"那时雨","东京不太热","一滴泪的时间","夏天的风","怪我咯",
"虚拟","宠坏","不要忘记我爱你","树的花语","奇妙能力歌",
"左手右手","天龙八部之宿敌","南泥湾","越来越不懂","公主殿下",
"宝贝","有雨有雨","粉雾海","宠爱","红昭愿","等","Doll",
"日不落","怎么了","我们","红色高跟鞋","关键词","怪物",
"第57次取消发送","凑热闹","嗯哼","怪物","不怕","如果爱忘了",
"摆","几分之几","take me hand"

];

const grid = document.getElementById("songGrid");

songs.forEach(song=>{

    const btn=document.createElement("button");

    btn.className="song";

    btn.innerText=song;

    btn.onclick=()=>{

        alert("现在播放：" + song + "（之后你可以换成真实音频）");

    };

    grid.appendChild(btn);

});

/* 搜索 */

const searchInput=document.getElementById("searchInput");

searchInput.addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        const value=searchInput.value.trim();

        if(songs.includes(value)){

            alert("找到歌曲：" + value);

        }else{

            alert("不好意思 笨笨的还不会这首歌 可以加入待学歌单哟");

        }

    }

});

</script>

</body>
</html>
```
