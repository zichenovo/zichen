<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>笨笨的の歌单</title>

<link
href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap"
rel="stylesheet"
>

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;

}

body{

font-family:
"PingFang SC",
sans-serif;

background:

linear-gradient(
rgba(255,255,255,0.56),
rgba(255,255,255,0.56)
),

url("c5b43b83798577953b44d9cf363b9d59.jpg");

background-size:cover;
background-position:center;
background-attachment:fixed;

min-height:100vh;

overflow-x:hidden;

}

.container{

width:92%;
max-width:700px;

margin:auto;

padding-top:45px;
padding-bottom:90px;

position:relative;

}

.title{

font-family:'Baloo 2', cursive;

font-size:62px;

font-weight:800;

line-height:1.05;

color:#5a5a5a;

margin-bottom:32px;

letter-spacing:2px;

text-shadow:

0 0 14px rgba(255,255,255,0.75);

}

.top-tip{

position:absolute;

top:48px;
right:0;

font-size:15px;

color:#777;

background:rgba(255,255,255,0.34);

padding:10px 18px;

border-radius:999px;

backdrop-filter:blur(8px);

}

.search{

width:100%;

height:62px;

border:none;

border-radius:999px;

padding-left:24px;

font-size:21px;

background:rgba(255,255,255,0.38);

backdrop-filter:blur(10px);

color:#555;

outline:none;

box-shadow:

0 0 22px rgba(255,255,255,0.18);

margin-bottom:42px;

}

.search::placeholder{

color:#8a8a8a;

}

.music{

position:absolute;

font-size:34px;

opacity:0.17;

color:#666;

pointer-events:none;

}

.m1{

top:120px;
right:40px;

}

.m2{

top:320px;
left:-10px;

}

.m3{

bottom:120px;
right:10px;

}

.m4{

bottom:40px;
left:10px;

}

.song-grid{

display:grid;

grid-template-columns:
repeat(3, 1fr);

gap:18px 22px;

}

.song{

font-size:24px;

font-weight:600;

color:#4f4f4f;

cursor:pointer;

transition:0.2s;

width:fit-content;

position:relative;

line-height:1.45;

}

.song:hover{

transform:scale(1.07);

color:#8d8d8d;

}

.song:hover::after{

content:"♪";

position:absolute;

right:-18px;
top:-2px;

font-size:15px;

color:#999;

}

.song-page{

display:none;

min-height:100vh;

padding:50px 28px;

background:

linear-gradient(
rgba(255,255,255,0.56),
rgba(255,255,255,0.56)
),

url("c5b43b83798577953b44d9cf363b9d59.jpg");

background-size:cover;
background-position:center;

}

.back{

font-size:18px;

color:#666;

margin-bottom:34px;

display:inline-block;

cursor:pointer;

}

.song-title{

font-size:46px;

font-weight:bold;

color:#555;

margin-bottom:28px;

}

.cover{

width:100%;

border-radius:26px;

margin-bottom:30px;

}

audio{

width:100%;

}

.not-found{

display:none;

min-height:100vh;

padding:60px 28px;

background:

linear-gradient(
rgba(255,255,255,0.56),
rgba(255,255,255,0.56)
),

url("c5b43b83798577953b44d9cf363b9d59.jpg");

background-size:cover;
background-position:center;

}

.not-found h1{

font-size:48px;

color:#555;

margin-bottom:22px;

}

.not-found p{

font-size:22px;

line-height:1.9;

color:#777;

}

</style>

</head>

<body>

<div
class="container"
id="homePage"
>

<div class="top-tip">
♫ 点击歌名试听
</div>

<div class="music m1">♫</div>
<div class="music m2">♪</div>
<div class="music m3">♬</div>
<div class="music m4">♩</div>

<div class="title">
笨笨的の歌单
</div>

<input

class="search"

id="searchInput"

placeholder="试试搜索"

>

<div
class="song-grid"
id="songList"
></div>

</div>

<div
class="song-page"
id="songPage"
>

<div
class="back"
onclick="goHome()"
>

← 返回歌单

</div>

<img

class="cover"

id="songImage"

src="c5b43b83798577953b44d9cf363b9d59.jpg"

>

<div
class="song-title"
id="songTitle"
></div>

<audio controls>

<source
src=""
type="audio/mpeg"
>

</audio>

</div>

<div
class="not-found"
id="notFoundPage"
>

<div
class="back"
onclick="goHome()"
>

← 返回

</div>

<h1>
不好意思
</h1>

<p>

笨笨的还不会这首歌<br>

可以加入待学歌单哟

</p>

</div>

<script>

const songs = [

"等","摆","嗯哼",

"末日","走马","天赋","空空","宠爱","Doll","怪物",

"绿色","虚拟","宠坏","宝贝","失眠了","小公主",

"半壶纱","要爱我","那时雨","红昭愿","关键词",

"after17","粉雾海","南泥湾","凑热闹",

"东京不太热","越来越不懂","夏天的风",

"左手右手","奇妙能力歌","心愿便利贴",

"AlwaysOnline","第57次取消发送",

"你的crush降临了吗",

"如果爱忘了","几分之几","take me hand",

"不怕","有雨有雨","怎么了","我们",

"日不落","怪我咯","怪物",

"爱我你就抱抱我",

"树的花语","公主殿下",

"梁山伯与朱丽叶",

"不要忘记我爱你",

"天龙八部之宿敌",

"红色高跟鞋"

];

const songList = document.getElementById("songList");

songs.sort((a,b)=>a.length-b.length);

songs.forEach(song=>{

const item=document.createElement("div");

item.className="song";

item.innerText=song;

item.onclick=()=>openSong(song);

songList.appendChild(item);

});

function openSong(song){

document.getElementById("homePage").style.display="none";

document.getElementById("notFoundPage").style.display="none";

document.getElementById("songPage").style.display="block";

document.getElementById("songTitle").innerText=song;

}

function goHome(){

document.getElementById("homePage").style.display="block";

document.getElementById("songPage").style.display="none";

document.getElementById("notFoundPage").style.display="none";

}

document
.getElementById("searchInput")
.addEventListener("keypress",function(event){

if(event.key==="Enter"){

const value=this.value.trim();

if(songs.includes(value)){

openSong(value);

}

else{

document.getElementById("homePage").style.display="none";

document.getElementById("songPage").style.display="none";

document.getElementById("notFoundPage").style.display="block";

}

}

});

</script>

</body>

</html>
