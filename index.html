<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8" />

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
/>

<title>笨笨的の歌单</title>

<style>

body {

    margin: 0;

    padding: 0;

    min-height: 100vh;

    overflow-x: hidden;

    font-family:
        "Helvetica Neue",
        "PingFang SC",
        sans-serif;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.55),
            rgba(255,255,255,0.55)
        ),

        url("c5b43b83798577953b44d9cf363b9d59.jpg");

    background-size: cover;

    background-position: center;

    background-attachment: fixed;

}

.container {

    width: 88%;

    max-width: 1450px;

    margin: auto;

    padding-top: 55px;

    padding-bottom: 120px;

    position: relative;

}

.title {

    font-size: 78px;

    font-weight: 900;

    color: #444;

    letter-spacing: 4px;

    margin-bottom: 45px;

    text-shadow:

        0 0 8px rgba(255,255,255,0.7);

}

.search-box {

    width: 100%;

    max-width: 760px;

    height: 68px;

    border-radius: 999px;

    border: 1.5px solid rgba(255,255,255,0.7);

    background: rgba(255,255,255,0.35);

    backdrop-filter: blur(8px);

    padding-left: 28px;

    font-size: 22px;

    color: #555;

    outline: none;

    box-sizing: border-box;

    box-shadow:

        0 0 16px rgba(255,255,255,0.18);

}

.search-box::placeholder {

    color: rgba(100,100,100,0.7);

}

.tip {

    margin-top: 22px;

    display: inline-flex;

    align-items: center;

    gap: 12px;

    padding: 15px 24px;

    border-radius: 999px;

    background: rgba(255,255,255,0.42);

    color: #666;

    font-size: 22px;

    border: 1px solid rgba(255,255,255,0.65);

}

.songs {

    margin-top: 70px;

    display: grid;

    grid-template-columns:

        repeat(auto-fit, minmax(190px, 1fr));

    gap: 32px 50px;

}

.song {

    color: #444;

    text-decoration: none;

    font-size: 24px;

    transition: 0.22s;

    cursor: pointer;

    width: fit-content;

    position: relative;

    font-weight: 600;

}

.song:hover {

    color: #888;

    transform: scale(1.06);

}

.song:hover::after {

    content: "♪";

    position: absolute;

    right: -24px;

    top: -1px;

    color: #aaa;

}

.music-note {

    position: absolute;

    font-size: 42px;

    opacity: 0.28;

    color: #666;

}

.note1 {

    top: 90px;

    right: 240px;

}

.note2 {

    top: 230px;

    right: 100px;

}

.note3 {

    bottom: 120px;

    right: 80px;

}

.note4 {

    bottom: 80px;

    left: 60px;

}

.note5 {

    top: 380px;

    left: 30px;

}

.sparkle {

    position: absolute;

    color: #999;

    opacity: 0.32;

    font-size: 26px;

}

.sparkle1 {

    top: 120px;

    left: 700px;

}

.sparkle2 {

    top: 420px;

    right: 360px;

}

.sparkle3 {

    bottom: 90px;

    left: 480px;

}

.vinyl {

    position: absolute;

    bottom: 20px;

    right: 40px;

    font-size: 110px;

    opacity: 0.18;

}

.headphone {

    position: absolute;

    bottom: 20px;

    left: 10px;

    font-size: 110px;

    opacity: 0.16;

}

.song-page {

    display: none;

    min-height: 100vh;

    padding: 70px;

    box-sizing: border-box;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.58),
            rgba(255,255,255,0.58)
        ),

        url("c5b43b83798577953b44d9cf363b9d59.jpg");

    background-size: cover;

    background-position: center;

}

.back {

    color: #555;

    margin-bottom: 35px;

    display: inline-block;

    cursor: pointer;

    font-size: 20px;

}

.cover {

    width: 420px;

    max-width: 100%;

    border-radius: 24px;

    margin-bottom: 35px;

}

.song-title {

    font-size: 52px;

    color: #444;

    margin-bottom: 28px;

    font-weight: bold;

}

audio {

    width: 420px;

    max-width: 100%;

}

.not-found {

    display: none;

    min-height: 100vh;

    padding: 80px;

    box-sizing: border-box;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.58),
            rgba(255,255,255,0.58)
        ),

        url("c5b43b83798577953b44d9cf363b9d59.jpg");

    background-size: cover;

    background-position: center;

}

.not-found h1 {

    font-size: 58px;

    color: #444;

    margin-bottom: 28px;

}

.not-found p {

    color: #666;

    line-height: 2;

    font-size: 24px;

}

</style>

</head>

<body>

<div
    class="container"
    id="homePage"
>

    <div class="music-note note1">♪</div>
    <div class="music-note note2">♫</div>
    <div class="music-note note3">♬</div>
    <div class="music-note note4">♩</div>
    <div class="music-note note5">♪</div>

    <div class="sparkle sparkle1">✦</div>
    <div class="sparkle sparkle2">✧</div>
    <div class="sparkle sparkle3">✦</div>

    <div class="vinyl">💿</div>

    <div class="headphone">🎧</div>

    <div class="title">
        笨笨的の歌单
    </div>

    <input

        class="search-box"

        id="searchInput"

        placeholder="试试搜索"

    >

    <br>

    <div class="tip">

        ♫ 点击歌名可以试听哟

    </div>

    <div
        class="songs"
        id="songList"
    ></div>

</div>

<div
    class="song-page"
    id="songPage"
>

    <div
        class="back"
        onclick="goHome()"
    >

        ← 返回歌单

    </div>

    <img

        class="cover"

        id="songImage"

        src="c5b43b83798577953b44d9cf363b9d59.jpg"

    >

    <div
        class="song-title"
        id="songTitle"
    ></div>

    <audio controls>

        <source
            src=""
            type="audio/mpeg"
        >

    </audio>

</div>

<div
    class="not-found"
    id="notFoundPage"
>

    <div
        class="back"
        onclick="goHome()"
    >

        ← 返回

    </div>

    <h1>
        不好意思
    </h1>

    <p>

        笨笨的还不会这首歌<br>

        可以加入待学歌单哟

    </p>

</div>

<script>

const songs = [

    "流浪","温室","伏线","雪藏","背叛","收藏","雨天","揉光",
    "就让","散场","情结","恶作剧","慢慢的","说什么","贪吃蛇",
    "忘与记","复乐园","从此以后","假装快乐","何必不舍",
    "会呼吸的痛","夏日倒计时","一直很安静","最初的记忆",
    "抹不掉的你","想念拟人化","十二月的奇迹",
    "你就是我的风景","在加纳共和国离婚","你","瞬","坠","换",
    "于是","绽放","遐想","忘记","彻夜","白板","小微光","小胡同",
    "遗忘周","平行线","失落盛行","人群中的信","不见不离开",
    "NUNA3.0","你已把我的心磨平","想要成为的大人","有些",
    "慢慢","晚安","只你","篡改","嗜好","你想要的","孤单心事",
    "假装没变过","我只能离开","夏夜最后的烟火","我想","和你",
    "情话","再一起","九月底","天黑座","天气未报","日落沙滩后",
    "不对等天体","最好的都给你","触碰不到的你"

];

const songList = document.getElementById("songList");

songs.sort((a,b) => a.length - b.length);

songs.forEach(song => {

    const item = document.createElement("a");

    item.className = "song";

    item.innerText = song;

    item.onclick = () => openSong(song);

    songList.appendChild(item);

});

function openSong(song) {

    document.getElementById("homePage").style.display = "none";

    document.getElementById("notFoundPage").style.display = "none";

    document.getElementById("songPage").style.display = "block";

    document.getElementById("songTitle").innerText = song;

}

function goHome() {

    document.getElementById("homePage").style.display = "block";

    document.getElementById("songPage").style.display = "none";

    document.getElementById("notFoundPage").style.display = "none";

}

document
    .getElementById("searchInput")
    .addEventListener("keypress", function(event) {

        if (event.key === "Enter") {

            const value = this.value.trim();

            if (songs.includes(value)) {

                openSong(value);

            }

            else {

                document.getElementById("homePage").style.display = "none";

                document.getElementById("songPage").style.display = "none";

                document.getElementById("notFoundPage").style.display = "block";

            }

        }

    });

</script>

</body>

</html>
